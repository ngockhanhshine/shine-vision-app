<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Mê Cung Tập Mắt Nhược Thị - Shine Vision App</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            touch-action: manipulation;
            overflow-x: hidden;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #00e676;
            text-align: center;
        }
        .control-panel {
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        select, input[type="color"], button {
            padding: 6px 10px;
            border-radius: 5px;
            border: none;
            background-color: #2c2c2c;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }
        button {
            background-color: #00e676;
            color: #121212;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover {
            background-color: #00b359;
        }
        #game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border: 3px solid #333;
            border-radius: 8px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(255,255,255,0.05);
            touch-action: none;
        }
        .dpad {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 5px;
        }
        .dpad button {
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1.2rem;
            border: 1px solid #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dpad button:active {
            background-color: #00e676;
            color: #000;
        }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }

        @media (min-width: 768px) {
            .dpad { display: none; } /* Ẩn D-Pad trên màn hình máy tính */
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <h1>MÊ CUNG TẬP MẮT NHƯỢC THỊ</h1>

    <div class="control-panel">
        <div class="control-group">
            <label for="gridSize">Kích thước:</label>
            <select id="gridSize">
                <option value="10">Dễ (10x10)</option>
                <option value="15" selected>Vừa (15x15)</option>
                <option value="20">Khó (20x20)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="playerColor">Màu bi:</label>
            <input type="color" id="playerColor" value="#ff0000">
        </div>
        <div class="control-group">
            <label for="goalColor">Màu đích:</label>
            <input type="color" id="goalColor" value="#00ffff">
        </div>
        <div class="control-group">
            <label for="wallColor">Màu tường:</label>
            <input type="color" id="wallColor" value="#ffffff">
        </div>
        <button id="resetBtn">Tạo Mê Cung Mới</button>
    </div>

    <div id="game-container">
        <canvas id="mazeCanvas"></canvas>
    </div>

    <!-- Phím ảo cho thiết bị di động -->
    <div class="dpad">
        <button class="dpad-up" onclick="movePlayer(0, -1)">▲</button>
        <button class="dpad-left" onclick="movePlayer(-1, 0)">◄</button>
        <button class="dpad-right" onclick="movePlayer(1, 0)">►</button>
        <button class="dpad-down" onclick="movePlayer(0, 1)">▼</button>
    </div>

    <!-- HỆ THỐNG BẢO MẬT & XÁC THỰC LẤY TỪ APP CROSS -->
    <script>
        // 1. Kiểm tra tên miền chính chủ
        (function() {
            const allowedDomain = "shinevisionapp.com";
            if (window.location.hostname !== allowedDomain && !window.location.hostname.endsWith("." + allowedDomain)) {
                document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial;color:red;text-align:center;'><h3>Cảnh báo: Ứng dụng bị khoá</h3></div>";
                throw new Error("Unauthorized domain usage.");
            }
        })();

        // 2. Chống mở Developer Tools (F12, Console) & Tự động kết thúc phiên làm việc
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const check = function() {
                const devtools = { open: false };
                const element = new Image();
                Object.defineProperty(element, 'id', { get: function() { devtools.open = true; terminateSession(); } });
                function terminateSession() { localStorage.removeItem('user_login'); window.location.replace("about:blank"); document.body.innerHTML = ""; }
                console.log(element); console.clear();
                if (!isMobile) {
                    const threshold = 160;
                    if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) terminateSession();
                }
                if (devtools.open) terminateSession();
            };
            setInterval(function() {
                const start = performance.now();
                debugger;
                if (performance.now() - start > 100) window.location.replace("about:blank");
            }, 500);
            setInterval(check, 1000);
            window.addEventListener('resize', check);
        })();

        // 3. Bảo mật đăng nhập & Lắng nghe sự kiện Logout tự động thoát ra trang đăng nhập
        (function() {
            function checkAccess() {
                const loginData = JSON.parse(localStorage.getItem('user_login'));
                const currentTime = new Date().getTime();
                const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;
                if (!loginData || (currentTime - loginData.loginTime > TWENTY_FOUR_HOURS)) {
                    localStorage.removeItem('user_login');
                    window.location.href = '../index.html';
                }
            }
            checkAccess();
            // Lắng nghe sự kiện thay đổi localStorage (Khi đăng xuất từ tab khác hoặc bấm Logout)
            window.addEventListener('storage', (e) => { 
                if (e.key === 'user_login' && e.newValue === null) {
                    window.location.href = '../index.html'; 
                }
            });
            window.onfocus = () => checkAccess();
        })();

        // 4. Chặn menu chuột phải & Chặn các phím tắt mở console (F12, Ctrl+Shift+I, Ctrl+U), lưu trang (Ctrl+S)
        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('keydown', e => {
            if (
                e.key === "F12" || 
                (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) ||
                (e.ctrlKey && (e.key === "u" || e.key === "U")) ||
                (e.ctrlKey && (e.key === "s" || e.key === "S"))
            ) { 
                e.preventDefault(); 
            }
        });
    </script>

    <!-- LOGIC TRÒ CHƠI MÊ CUNG GIỮ NGUYÊN 100% -->
    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const gridSizeSelect = document.getElementById('gridSize');
        const playerColorInput = document.getElementById('playerColor');
        const goalColorInput = document.getElementById('goalColor');
        const wallColorInput = document.getElementById('wallColor');
        const resetBtn = document.getElementById('resetBtn');

        let cols, rows, cellSize;
        let grid = [];
        let player = { x: 0, y: 0 };
        let goal = { x: 0, y: 0 };

        class Cell {
            constructor(r, c) {
                this.r = r;
                this.c = c;
                this.walls = [true, true, true, true]; // Trên, Phải, Dưới, Trái
                this.visited = false;
            }

            draw() {
                let x = this.c * cellSize;
                let y = this.r * cellSize;
                ctx.strokeStyle = wallColorInput.value;
                ctx.lineWidth = Math.max(2, cellSize / 8);

                if (this.walls[0]) drawLine(x, y, x + cellSize, y);
                if (this.walls[1]) drawLine(x + cellSize, y, x + cellSize, y + cellSize);
                if (this.walls[2]) drawLine(x + cellSize, y + cellSize, x, y + cellSize);
                if (this.walls[3]) drawLine(x, y + cellSize, x, y);
            }
        }

        function drawLine(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function initGame() {
            let numCells = parseInt(gridSizeSelect.value);
            cols = numCells;
            rows = numCells;

            // Tính kích thước Canvas vừa màn hình
            let maxCanvasSize = Math.min(window.innerWidth - 40, 500);
            canvas.width = maxCanvasSize;
            canvas.height = maxCanvasSize;
            cellSize = canvas.width / cols;

            grid = [];
            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    row.push(new Cell(r, c));
                }
                grid.push(row);
            }

            generateMaze();
            player = { x: 0, y: 0 };
            goal = { x: cols - 1, y: rows - 1 };
            render();
        }

        function generateMaze() {
            let stack = [];
            let current = grid[0][0];
            current.visited = true;

            while (true) {
                let neighbors = getUnvisitedNeighbors(current);
                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    removeWalls(current, next);
                    stack.push(current);
                    current = next;
                    current.visited = true;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else {
                    break;
                }
            }
        }

        function getUnvisitedNeighbors(cell) {
            let neighbors = [];
            let { r, c } = cell;

            if (r > 0 && !grid[r - 1][c].visited) neighbors.push(grid[r - 1][c]);
            if (c < cols - 1 && !grid[r][c + 1].visited) neighbors.push(grid[r][c + 1]);
            if (r < rows - 1 && !grid[r + 1][c].visited) neighbors.push(grid[r + 1][c]);
            if (c > 0 && !grid[r][c - 1].visited) neighbors.push(grid[r][c - 1]);

            return neighbors;
        }

        function removeWalls(a, b) {
            let x = a.c - b.c;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }

            let y = a.r - b.r;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ tường mê cung
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c].draw();
                }
            }

            // Vẽ Điểm Đích
            ctx.fillStyle = goalColorInput.value;
            ctx.beginPath();
            let goalX = goal.x * cellSize + cellSize / 2;
            let goalY = goal.y * cellSize + cellSize / 2;
            ctx.arc(goalX, goalY, cellSize / 3, 0, Math.PI * 2);
            ctx.fill();

            // Vẽ Người Chơi (Viên bi)
            ctx.fillStyle = playerColorInput.value;
            ctx.beginPath();
            let playerX = player.x * cellSize + cellSize / 2;
            let playerY = player.y * cellSize + cellSize / 2;
            ctx.arc(playerX, playerY, cellSize / 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function movePlayer(dx, dy) {
            let currentCell = grid[player.y][player.x];
            let newX = player.x + dx;
            let newY = player.y + dy;

            if (newX < 0 || newX >= cols || newY < 0 || newY >= rows) return;

            // Kiểm tra tường chắn
            if (dx === 1 && currentCell.walls[1]) return;
            if (dx === -1 && currentCell.walls[3]) return;
            if (dy === 1 && currentCell.walls[2]) return;
            if (dy === -1 && currentCell.walls[0]) return;

            player.x = newX;
            player.y = newY;
            render();

            // Kiểm tra chiến thắng
            if (player.x === goal.x && player.y === goal.y) {
                setTimeout(() => {
                    alert('🎉 Chúc mừng! Bạn đã hoàn thành mê cung!');
                    initGame();
                }, 100);
            }
        }

        // Điều khiển bàn phím
        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': movePlayer(0, -1); break;
                case 'ArrowDown': case 's': case 'S': movePlayer(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': movePlayer(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': movePlayer(1, 0); break;
            }
        });

        // Event listeners
        resetBtn.addEventListener('click', initGame);
        gridSizeSelect.addEventListener('change', initGame);
        playerColorInput.addEventListener('input', render);
        goalColorInput.addEventListener('input', render);
        wallColorInput.addEventListener('input', render);

        // Khởi tạo lần đầu
        initGame();
    </script>
</body>
</html>
